<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC MASTER PRECIOS</title>
    <style>
        :root {
            --bg-deep: #090d16;
            --bg-card: #111827;
            --border-tech: #1f293d;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.15);
            --accent: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            padding: 2.5rem 1rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-tech);
            padding-bottom: 1.5rem;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-tech);
            padding: 0.8rem 1.8rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .tab-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .tab-btn.active {
            background-color: var(--primary-glow);
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .catalog-section {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-tech);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease-in-out;
        }

        .catalog-section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .search-box { margin-bottom: 1.5rem; }
        
        .search-box input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            font-size: 1rem;
            background-color: #0d1322;
            border: 1px solid var(--border-tech);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .table-container { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-tech);
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        td {
            color: #d1d5db;
            font-size: 0.95rem;
        }

        tr:hover td {
            background-color: rgba(56, 189, 248, 0.02);
        }

        .price-tag {
            font-weight: 700;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PC MASTER PRECIOS</h1>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('celulares')">📱 Celulares</button>
            <button class="tab-btn" onclick="switchTab('consolas')">🎮 Consolas</button>
            <button class="tab-btn" onclick="switchTab('computadoras')">💻 Computadoras</button>
        </div>

        <div id="celulares" class="catalog-section active">
            <div class="search-box"><input type="text" id="search-celulares" placeholder="Buscar componente o modelo en celulares..." onkeyup="filterTable('celulares')"></div>
            <div class="table-container"><table id="table-celulares"><thead><tr><th>Marca / Ítem</th><th>Descripción Detallada</th><th>Precio</th></tr></thead><tbody></tbody></table></div>
        </div>

        <div id="consolas" class="catalog-section">
            <div class="search-box"><input type="text" id="search-consolas" placeholder="Buscar componente o modelo en consolas..." onkeyup="filterTable('consolas')"></div>
            <div class="table-container"><table id="table-consolas"><thead><tr><th>Marca / Ítem</th><th>Descripción Detallada</th><th>Precio</th></tr></thead><tbody></tbody></table></div>
        </div>

        <div id="computadoras" class="catalog-section">
            <div class="search-box"><input type="text" id="search-computadoras" placeholder="Buscar componente o modelo en computadoras..." onkeyup="filterTable('computadoras')"></div>
            <div class="table-container"><table id="table-computadoras"><thead><tr><th>Marca / Ítem</th><th>Descripción Detallada</th><th>Precio</th></tr></thead><tbody></tbody></table></div>
        </div>
    </div>

    <script>
        let datosGlobales = {};

        async function cargarDatos() {
            try {
                const response = await fetch('datos.json');
                datosGlobales = await response.json();
                renderTablas();
            } catch (error) {
                console.error("Error al cargar los precios:", error);
            }
        }

        function renderTablas() {
            ['celulares', 'consolas', 'computadoras'].forEach(cat => {
                const tbody = document.querySelector(`#table-${cat} tbody`);
                tbody.innerHTML = "";
                if (datosGlobales[cat]) {
                    datosGlobales[cat].forEach(row => {
                        tbody.innerHTML += `<tr><td>${row.item}</td><td>${row.detalle}</td><td class="price-tag">${row.precio}</td></tr>`;
                    });
                }
            });
        }

        function switchTab(category) {
            document.querySelectorAll('.catalog-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(category).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function filterTable(category) {
            const filter = document.getElementById(`search-${category}`).value.toLowerCase();
            const tr = document.querySelectorAll(`#table-${category} tbody tr`);
            tr.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(filter) ? "" : "none";
            });
        }

        cargarDatos();
    </script>
</body>
</html>
