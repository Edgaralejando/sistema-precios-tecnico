<!DOCTYPE html>
<html lang="es">
<head>

    <style>
        :root {
            --bg-deep: #090d16;
            --bg-card: #111827;
            --border-tech: #1f293d;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.15);
            --accent: #10b981;
            --warning: #f59e0b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            padding: 2.5rem 1rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-tech);
            padding-bottom: 1.5rem;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .admin-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-tech);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .admin-panel h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-grid input, .form-grid select {
            padding: 0.8rem;
            background-color: #0d1322;
            border: 1px solid var(--border-tech);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .form-grid input:focus, .form-grid select:focus {
            border-color: var(--primary);
        }

        .panel-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn-add {
            background-color: var(--accent);
            color: #090d16;
            font-weight: 700;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-add:hover { opacity: 0.9; }

        .btn-bulk {
            background-color: #8b5cf6;
            color: white;
            font-weight: 700;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-bulk:hover { opacity: 0.9; }

        .btn-clean {
            background-color: #d97706;
            color: white;
            font-weight: 700;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-clean:hover { opacity: 0.9; }

        .btn-cancel {
            background-color: #ef4444;
            color: white;
            font-weight: 700;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: none;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-tech);
            padding: 0.8rem 1.8rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background-color: var(--primary-glow);
        }

        .sub-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .sub-tab-btn {
            background-color: #0d1322;
            border: 1px solid var(--border-tech);
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .sub-tab-btn:hover, .sub-tab-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background-color: rgba(16, 185, 129, 0.1);
        }

        .catalog-section {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-tech);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .catalog-section.active { display: block; }

        .search-box { margin-bottom: 1.5rem; }
        
        .search-box input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            font-size: 1rem;
            background-color: #0d1322;
            border: 1px solid var(--border-tech);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .table-container { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-tech);
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        td { color: #d1d5db; font-size: 0.95rem; }

        .price-tag {
            font-weight: 700;
            color: var(--accent);
        }

        .btn-edit {
            background-color: var(--warning);
            color: #090d16;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-edit:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PC MASTER PRECIOS</h1>

        <div class="admin-panel">

            <input type="hidden" id="edit-id">
            <div class="form-grid">
                <select id="nuevo-categoria" onchange="toggleSubcategoria()">
                    <option value="celulares">Celulares</option>
                    <option value="consolas">Consolas</option>
                    <option value="computadoras">Computadoras</option>
                </select>
                <select id="nuevo-subcategoria">
                    <option value="Pantallas">Pantallas</option>
                    <option value="Baterias">Baterías</option>
                    <option value="Puertos de carga">Puertos de carga</option>
                    <option value="Parlantes">Parlantes</option>
                    <option value="Camaras">Cámaras</option>
                    <option value="Tapas traseras">Tapas traseras</option>
                </select>
                <input type="text" id="nuevo-item" placeholder="Marca (Ej: HUAWEI, XIAOMI)">
                <input type="text" id="nuevo-detalle" placeholder="Detalle (Ej: IPHONE 6 S/M)">
                <input type="text" id="nuevo-precio" placeholder="Precio (Ej: $25.000 o Consultar)">
            </div>
            <div class="panel-actions">
                <button class="btn-add" id="btn-accion" onclick="guardarItemBD()">Guardar en la Base de Datos</button>
                <button class="btn-bulk" onclick="cargarProductosMasivos()">🚀 Cargar faltantes</button>
                <button class="btn-clean" onclick="limpiarDuplicadosBD()">🧹 Borrar Duplicados de Firebase</button>
                <button class="btn-cancel" id="btn-cancelar" onclick="limpiarFormulario()">Cancelar Edición</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('celulares')">📱 Celulares</button>
            <button class="tab-btn" onclick="switchTab('consolas')">🎮 Consolas</button>
            <button class="tab-btn" onclick="switchTab('computadoras')">💻 Computadoras</button>
        </div>

        <div id="celulares" class="catalog-section active">
            <div class="sub-tabs">
                <button class="sub-tab-btn active" onclick="filterSubcat('todos', this)">Todos</button>
                <button class="sub-tab-btn" onclick="filterSubcat('Pantallas', this)">Pantallas</button>
                <button class="sub-tab-btn" onclick="filterSubcat('Baterias', this)">Baterías</button>
                <button class="sub-tab-btn" onclick="filterSubcat('Puertos de carga', this)">Puertos de carga</button>
                <button class="sub-tab-btn" onclick="filterSubcat('Parlantes', this)">Parlantes</button>
                <button class="sub-tab-btn" onclick="filterSubcat('Camaras', this)">Cámaras</button>
                <button class="sub-tab-btn" onclick="filterSubcat('Tapas traseras', this)">Tapas traseras</button>
            </div>
            <div class="search-box"><input type="text" id="search-celulares" placeholder="Buscar componente o modelo en celulares..." oninput="debounceFilter('celulares')"></div>
            <div class="table-container"><table id="table-celulares"><thead><tr><th>Marca / Ítem</th><th>Descripción Detallada</th><th>Precio</th><th>Acciones</th></tr></thead><tbody></tbody></table></div>
        </div>

        <div id="consolas" class="catalog-section">

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.datosMemoria = {};

        window.toggleSubcategoria = function() {
            const cat = document.getElementById('nuevo-categoria').value;
            const subcatSelect = document.getElementById('nuevo-subcategoria');
            subcatSelect.style.display = (cat === 'celulares') ? 'inline-block' : 'none';
        };

        window.cargarDatosBD = async function() {
            try {
                const querySnapshot = await getDocs(collection(db, "precios"));
                window.datosMemoria = {};
                let datosGlobales = { celulares: [], consolas: [], computadoras: [] };

                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    const id = documento.id;
                    window.datosMemoria[id] = data;
                    if (datosGlobales[data.categoria]) {
                        datosGlobales[data.categoria].push({ id, ...data });
                    }
                });

                ['celulares', 'consolas', 'computadoras'].forEach(cat => {
                    const tbody = document.querySelector(`#table-${cat} tbody`);
                    tbody.innerHTML = "";
                    datosGlobales[cat].forEach(row => {
                        const subcatAttr = row.subcategoria ? row.subcategoria : 'Pantallas';
                        tbody.innerHTML += `
                            <tr data-subcat="${subcatAttr}">
                                <td>${row.item}</td>
                                <td>${row.detalle}</td>
                                <td class="price-tag">${row.precio}</td>
                                <td><button class="btn-edit" onclick="prepararEdicion('${row.id}')">✏️ Editar</button></td>
                            </tr>`;
                    });
                });
                filterSubcat(window.subcatActual);
            } catch (error) {
                console.error("Error al cargar la base de datos:", error);
            }
        };

        // Función para limpiar elementos duplicados de la base de datos automáticamente
        window.limpiarDuplicadosBD = async function() {
            if (!confirm("🧹 ¿Deseas escanear y eliminar los productos repetidos en Firebase?")) return;

            try {
                const querySnapshot = await getDocs(collection(db, "precios"));
                const vistos = new Set();
                let eliminados = 0;

                for (const documento of querySnapshot.docs) {
                    const d = documento.data();
                    const clave = `${d.categoria}_${d.subcategoria || ''}_${d.item}_${d.detalle}`.toLowerCase();

                    if (vistos.has(clave)) {
                        await deleteDoc(doc(db, "precios", documento.id));
                        eliminados++;
                    } else {
                        vistos.add(clave);
                    }
                }

                alert(`¡Limpieza completada! Se eliminaron ${eliminados} registros duplicados.`);
                window.cargarDatosBD();
            } catch (error) {
                alert("Error al limpiar duplicados: " + error.message);
                console.error(error);
            }
        };

        window.guardarItemBD = async function() {
            const editId = document.getElementById('edit-id').value;
            const categoria = document.getElementById('nuevo-categoria').value;
            const subcategoria = (categoria === 'celulares') ? document.getElementById('nuevo-subcategoria').value : '';
            const item = document.getElementById('nuevo-item').value.trim();
            const detalle = document.getElementById('nuevo-detalle').value.trim();
            const precio = document.getElementById('nuevo-precio').value.trim();

            if (!item || !detalle || !precio) {
                alert("Por favor completa todos los campos.");
                return;
            }

            try {
                if (editId) {
                    const docRef = doc(db, "precios", editId);
                    await updateDoc(docRef, { categoria, subcategoria, item, detalle, precio });
                    alert("¡Ítem actualizado correctamente en la nube!");
                } else {
                    await addDoc(collection(db, "precios"), {
                        categoria,
                        subcategoria,
                        item,
                        detalle,
                        precio,
                        fecha: new Date()
                    });
                    alert("¡Ítem guardado permanentemente en la nube!");
                }

                window.limpiarFormulario();
                window.cargarDatosBD();
            } catch (error) {
                alert("Error en la base de datos: " + error.message);
                console.error(error);
            }
        };

    <script>
        function switchTab(category) {
            document.querySelectorAll('.catalog-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(category).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function filterSubcat(subcat, btnElement) {
            window.subcatActual = subcat;
            if (btnElement) {
                document.querySelectorAll('#celulares .sub-tab-btn').forEach(b => b.classList.remove('active'));
                btnElement.classList.add('active');
            }
            const rows = document.querySelectorAll('#table-celulares tbody tr');
            rows.forEach(row => {
                const rowSubcat = row.getAttribute('data-subcat');
                if (subcat === 'todos' || rowSubcat === subcat) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        // Búsqueda optimizada con retardo (debounce) para evitar que se cuelgue en móviles
        let searchTimeout;
        function debounceFilter(category) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                filterTable(category);
            }, 150);
        }

        function filterTable(category) {
            const filter = document.getElementById(`search-${category}`).value.toLowerCase();
            const tr = document.querySelectorAll(`#table-${category} tbody tr`);
            
            requestAnimationFrame(() => {
                tr.forEach(row => {
                    const text = row.innerText.toLowerCase();
                    const matchesSearch = text.includes(filter);
                    const matchesSubcat = (category !== 'celulares' || window.subcatActual === 'todos' || row.getAttribute('data-subcat') === window.subcatActual);
                    row.style.display = (matchesSearch && matchesSubcat) ? "" : "none";
                });
            });
        }
    </script>
