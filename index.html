<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC MASTER PRECIOS</title>
    <style>
        :root {
            --bg-deep: #090d16;
            --bg-card: #111827;
            --border-tech: #1f293d;
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.15);
            --accent: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            padding: 2.5rem 1rem;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid var(--border-tech);
            padding-bottom: 1.5rem;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        .admin-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-tech);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .admin-panel h3 {
            color: var(--primary);
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-grid input, .form-grid select {
            padding: 0.8rem;
            background-color: #0d1322;
            border: 1px solid var(--border-tech);
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        .form-grid input:focus, .form-grid select:focus {
            border-color: var(--primary);
        }

        .btn-add {
            background-color: var(--accent);
            color: #090d16;
            font-weight: 700;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn-add:hover { opacity: 0.9; }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-tech);
            padding: 0.8rem 1.8rem;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background-color: var(--primary-glow);
        }

        .catalog-section {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border-tech);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .catalog-section.active { display: block; }

        .search-box { margin-bottom: 1.5rem; }
        
        .search-box input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            font-size: 1rem;
            background-color: #0d1322;
            border: 1px solid var(--border-tech);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .table-container { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-tech);
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--primary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        td { color: #d1d5db; font-size: 0.95rem; }

        .price-tag {
            font-weight: 700;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PC MASTER PRECIOS</h1>
        </header>

        <!-- Panel para agregar ítems a la base de datos en la nube -->
        <div class="admin-panel">
            <h3>➕ Agregar Nuevo Ítem a la Nube</h3>
            <div class="form-grid">
                <select id="nuevo-categoria">
                    <option value="celulares">Celulares</option>
                    <option value="consolas">Consolas</option>
                    <option value="computadoras">Computadoras</option>
                </select>
                <input type="text" id="nuevo-item" placeholder="Marca (Ej: HUAWEI, XIAOMI)">
                <input type="text" id="nuevo-detalle" placeholder="Detalle (Ej: Pantalla OLED S/M)">
                <input type="text" id="nuevo-precio" placeholder="Precio (Ej: $25.000 o Consultar)">
            </div>
            <button class="btn-add" onclick="agregarItemBD()">Guardar en la Base de Datos</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('celulares')">📱 Celulares</button>
            <button class="tab-btn" onclick="switchTab('consolas')">🎮 Consolas</button>
            <button class="tab-btn" onclick="switchTab('computadoras')">💻 Computadoras</button>
        </div>

        <div id="celulares" class="catalog-section active">
            <div class="search-box"><input type="text" id="search-celulares" placeholder="Buscar componente o modelo en celulares..." onkeyup="filterTable('celulares')"></div>
            <div class="table-container"><table id="table-celulares"><thead><tr><th>Marca / Ítem</th><th>Descripción Detallada</th><th>Precio</th></tr></thead><tbody></tbody></table></div>
        </div>

        <div id="consolas" class="catalog-section">
            <div class="search-box"><input type="text" id="search-consolas" placeholder="Buscar componente o modelo en consolas..." onkeyup="filterTable('consolas')"></div>
            <div class="table-container"><table id="table-consolas"><thead><tr><th>Marca / Ítem</th><th>Descripción Detallada</th><th>Precio</th></tr></thead><tbody></tbody></table></div>
        </div>

        <div id="computadoras" class="catalog-section">
            <div class="search-box"><input type="text" id="search-computadoras" placeholder="Buscar componente o modelo en computadoras..." onkeyup="filterTable('computadoras')"></div>
            <div class="table-container"><table id="table-computadoras"><thead><tr><th>Marca / Ítem</th><th>Descripción Detallada</th><th>Precio</th></tr></thead><tbody></tbody></table></div>
        </div>
    </div>

    <!-- SDK de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ REEMPLAZA ESTO CON TUS CREDENCIALES REALES DE FIREBASE
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "tu_id",
            appId: "tu_app_id"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.cargarDatosBD = async function() {
            try {
                const querySnapshot = await getDocs(collection(db, "precios"));
                let datosGlobales = { celulares: [], consolas: [], computadoras: [] };

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if (datosGlobales[data.categoria]) {
                        datosGlobales[data.categoria].push(data);
                    }
                });

                ['celulares', 'consolas', 'computadoras'].forEach(cat => {
                    const tbody = document.querySelector(`#table-${cat} tbody`);
                    tbody.innerHTML = "";
                    datosGlobales[cat].forEach(row => {
                        tbody.innerHTML += `<tr><td>${row.item}</td><td>${row.detalle}</td><td class="price-tag">${row.precio}</td></tr>`;
                    });
                });
            } catch (error) {
                console.error("Error al cargar la base de datos:", error);
            }
        };

        window.agregarItemBD = async function() {
            const categoria = document.getElementById('nuevo-categoria').value;
            const item = document.getElementById('nuevo-item').value.trim();
            const detalle = document.getElementById('nuevo-detalle').value.trim();
            const precio = document.getElementById('nuevo-precio').value.trim();

            if (!item || !detalle || !precio) {
                alert("Por favor completa todos los campos.");
                return;
            }

            try {
                await addDoc(collection(db, "precios"), {
                    categoria,
                    item,
                    detalle,
                    precio,
                    fecha: new Date()
                });

                alert("¡Ítem guardado permanentemente en la nube!");
                document.getElementById('nuevo-item').value = "";
                document.getElementById('nuevo-detalle').value = "";
                document.getElementById('nuevo-precio').value = "";
                window.cargarDatosBD();
            } catch (error) {
                alert("Error al guardar en la base de datos: " + error.message);
                console.error(error);
            }
        };

        window.cargarDatosBD();
    </script>

    <script>
        function switchTab(category) {
            document.querySelectorAll('.catalog-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(category).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function filterTable(category) {
            const filter = document.getElementById(`search-${category}`).value.toLowerCase();
            const tr = document.querySelectorAll(`#table-${category} tbody tr`);
            tr.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(filter) ? "" : "none";
            });
        }
    </script>
</body>
</html>
